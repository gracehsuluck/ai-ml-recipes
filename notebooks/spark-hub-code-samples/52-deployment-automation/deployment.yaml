environments:
  dev:
    project: "YOUR_PROJECT_ID"
    region: "us-central1"
    composer_environment: "dev-scheduler"
    artifact_storage:
      bucket: "YOUR_GCS_BUCKET"
      path_prefix: "pipelines/dev"
    variables:
      env_name: "dev"
      dbt_target: "dev"
      iceberg_schema: "ecommerce_dev"
      service_account: "YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com"
      network_uri: "projects/YOUR_PROJECT_ID/global/networks/default"
    pipelines:
      - source: "dev-pipeline.yaml"

  staging:
    project: "YOUR_PROJECT_ID"
    region: "us-central1"
    composer_environment: "dev-scheduler"
    artifact_storage:
      bucket: "YOUR_GCS_BUCKET"
      path_prefix: "pipelines/staging"
    variables:
      env_name: "staging"
      dbt_target: "staging"
      iceberg_schema: "ecommerce_staging"
      service_account: "YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com"
      network_uri: "projects/YOUR_PROJECT_ID/global/networks/default"
    pipelines:
      - source: "dev-pipeline.yaml"

  prod:
    project: "YOUR_PROJECT_ID"
    region: "us-central1"
    composer_environment: "dev-scheduler"
    artifact_storage:
      bucket: "YOUR_GCS_BUCKET"
      path_prefix: "pipelines/prod"
    variables:
      env_name: "prod"
      dbt_target: "prod"
      iceberg_schema: "ecommerce"
      service_account: "YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com"
      network_uri: "projects/YOUR_PROJECT_ID/global/networks/default"
    pipelines:
      - source: "dev-pipeline.yaml"
